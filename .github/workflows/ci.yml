name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # No defaults in Settings for these on purpose (see config.py): CI
      # must set them explicitly, same as any other environment.
      JWT_SECRET_KEY: ci-only-jwt-secret
      QR_HMAC_SECRET: ci-only-qr-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./e2e.db
      FRONTEND_ORIGIN: http://localhost:4173
      JWT_SECRET_KEY: ci-only-jwt-secret
      QR_HMAC_SECRET: ci-only-qr-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Apply migrations and load E2E fixtures
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.e2e_fixtures
      - name: Start backend
        working-directory: backend
        run: nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend against the CI backend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
      - name: Start frontend preview
        working-directory: frontend
        run: nohup npm run preview -- --port 4173 --host > /tmp/frontend.log 2>&1 &

      - name: Wait for both servers
        run: |
          for url in http://localhost:8000/health http://localhost:4173; do
            for i in $(seq 1 30); do
              curl -sf "$url" > /dev/null && break
              sleep 1
              if [ "$i" -eq 30 ]; then echo "Timed out waiting for $url"; exit 1; fi
            done
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- backend ---"; cat /tmp/backend.log || true
          echo "--- frontend ---"; cat /tmp/frontend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
